<script>
    (function () {
        var shopAllUrl = '/product/list.html?cate_no=45';
        var path = window.location.pathname || '';
        var cateNo = new URLSearchParams(window.location.search).get('cate_no');

        if (cateNo === '24' || /\/category\/shop\/24\/?$/i.test(path)) {
            window.location.replace(shopAllUrl);
            return;
        }

        function fixShopBreadcrumb() {
            document.querySelectorAll('.path ol li a').forEach(function (link) {
                var href = link.getAttribute('href') || '';
                if (link.textContent.trim() === 'Shop' && (/cate_no=24|\/category\/shop\/24/i.test(href))) {
                    link.setAttribute('href', shopAllUrl);
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fixShopBreadcrumb);
        } else {
            fixShopBreadcrumb();
        }
    })();
</script>
