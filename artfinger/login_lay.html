<div module="member_login" class="ec-base-box typeBlank bg_gray">
    <!--@css(/css/module/member/login.css)-->
    <!--
        $defaultReturnUrl = /index.html
        $forbidIpUrl = member/adminFail.html
    -->
    <div class="login">
        <!-- Sign In Section -->
        <div class="sign-in-section">
            <h3 class="section-title">Sign In</h3>
            <fieldset class="bg_white">
                <legend>ACCOUNT</legend>
                <label class="id ePlaceholder" title="ID">{$form.member_id}</label>
                <label class="password ePlaceholder" title="Password">{$form.member_passwd}</label>
                <a href="#none" class="btn_signin btn_sizeX" onclick="{$action_func_login}">Sign In</a>
                <a href="/member/join.html" class="btn_create_account btn_sizeX">Create Account</a>
                <ul class="snsArea">
                    <li class="{$display_kakao|display} kakao">
                        <a href="#none" onclick="{$kakao_func_login}">Login Via Kakao</a>
                    </li>
                    <li class="{$display_naver|display} naver">
                        <a href="#none" onclick="{$naver_func_login}">Login Via Naver</a>
                    </li>
                </ul>
                <div class="forgot_link">
                    <a href="/member/id/find_id.html">Forgot Id?</a>
                    <a href="/member/passwd/find_passwd_info.html">Forgot Password?</a>
                </div>
            </fieldset>
        </div>

        <!-- Order Status Section -->
        <div class="order-status-section is-collapsed">
            <h3 class="section-title order-status-title">Order Status</h3>
            <div class="order-status-desc">비회원으로 주문하셨더라도 주문 조회가 가능합니다.</div>
            <div class="order-status-form">
                <div module="MyShop_OrderHistoryNologin" class="bg_white">
                    <!--@css(/css/module/myshop/orderHistoryNologin.css)-->
                    <!--
                        $orderDetailUrl = /myshop/order/list.html
                    -->
                    <dl class="ec-base-desc gBlank20">
                        <dt>{$form_label.order_name}</dt>
                        <dd>{$form.order_name}</dd>
                        <dt>{$form_label.order_id}</dt>
                        <dd style="color:#bbb">{$form.order_id}</dd>
                        <dt>{$form_label.order_password}</dt>
                        <dd>{$form.order_password}</dd>
                    </dl>
                    <p class="ec-base-button gColumn submit">
                        <button type="submit" class="btn_check_status btn_sizeX">Check status</button>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
