<div class="login-page-wrap">
    <div module="member_login" class="ec-base-box typeBlank bg_gray signin-style">
        <!--@css(/css/module/member/login.css)-->
        <!--
        $defaultReturnUrl = /index.html
        $forbidIpUrl = member/adminFail.html
    -->
        <div class="login">
            <fieldset class="bg_white">
                <h3 class="boxTitle">Log In</h3>
                <legend>ACCOUNT</legend>
                <div class="log_wp">
                    <div class="log_wp1">
                        <label class="id ePlaceholder">{$form.member_id}</label>
                        <label class="password ePlaceholder">{$form.member_passwd}</label>
                        <a href="#none" class="btn_signin btn_sizeX" onclick="{$action_func_login}">Log In</a>
                        <ul class="snsArea">
                            <li class="{$display_kakao|display} kakao">
                                <a href="#none" onclick="{$kakao_func_login}">Log In With Kakao</a>
                            </li>
                            <li class="{$display_naver|display} naver">
                                <a href="#none" onclick="{$naver_func_login}">Log In With Naver</a>
                            </li>
                            <li class="{$display_facebook|display} facebook">
                                <a href="#none" onclick="{$facebook_func_login}"><img
                                        src="//ecudemo309264.cafe24.com/web/upload/addbase/addimage/fac-w.svg">Facebook으로
                                    로그인</a>
                            </li>
                            <li class="{$display_google|display} google">
                                <a href="#none" onclick="{$google_func_login}"><img
                                        src="//ecudemo309264.cafe24.com/web/upload/addbase/addimage/goo.svg">구글 로그인</a>
                            </li>
                            <li class="{$display_line|display} line">
                                <a href="#none" onclick="{$line_func_login}"><img
                                        src="//ecudemo309264.cafe24.com/web/upload/addbase/addimage/nav-w.svg">LINE
                                    로그인</a>
                            </li>
                            <li class="{$display_apple|display} apple">
                                <a href="#none" onclick="{$apple_func_login}"><img
                                        src="//ecudemo309264.cafe24.com/web/upload/addbase/addimage/apple.svg">Apple로
                                    로그인</a>
                            </li>
                        </ul>
                        <a href="/member/join.html" class="btn_create_account btn_sizeX">Create Account</a>
                        <div class="forgot_link">
                            <a href="/member/id/find_id.html">Forgot Id?</a>
                            <a href="/member/passwd/find_passwd_info.html">Forgot Password?</a>
                        </div>
                    </div>
                    <div class="log_wp2">
                        <div class="join_but order-status-block">
                            <a href="javascript:;" class="order-status-link" id="order-status-toggle"
                                aria-expanded="false">Order Status</a>
                            <p class="order-status-desc">비회원으로 주문하셨더라도 주문 조회가 가능합니다.</p>
                        </div>
                    </div>
                </div>
            </fieldset>
        </div>
    </div>

    <div class="guest-order-form-toggle is-closed" id="guest-order-form-toggle" aria-hidden="true">
        <form id="historyNoLogin" name="historyNoLogin" action="/exec/front/MyShop/OrderHistoryLogin/" method="POST"
            enctype="multipart/form-data" class="bg_white guest-order-form">
            <div class="xans-element- xans-myshop xans-myshop-orderhistorynologin ">
                <dl class="ec-base-desc guest-order-fields">
                    <dt>이름</dt>
                    <dd><input id="order_name" name="order_name" fw-filter="isFill" fw-label="주문자명" fw-msg=""
                            class="inputTypeText" placeholder="Name" value="" type="text"></dd>
                    <dt>주문번호</dt>
                    <dd>
                        <input id="order_id1" name="order_id1" maxlength="20" fw-filter="isFill" fw-label="주문번호"
                            fw-msg="" placeholder="Order Number" value="" type="text">
                        <input id="order_id2" name="order_id2" value="" type="hidden">
                    </dd>
                    <dt>게스트 비밀번호</dt>
                    <dd><input id="order_password" name="order_password" fw-filter="isFill" fw-label="비회원주문 비밀번호"
                            fw-msg="" placeholder="Guest Password" value="" type="password"></dd>
                </dl>
                <p class="ec-base-button gColumn submit">
                    <button type="button" class="guest-order-submit"
                        onclick="document.getElementById('historyNoLogin').submit();">Check status</button>
                </p>
            </div>
        </form>
    </div>
</div>
<script>
    (function () {
        function setPlaceholders() {
            var wrap = document.querySelector('.signin-style');
            if (wrap) {
                var idInput = wrap.querySelector('.login fieldset .id input[type=text], .login fieldset .id input');
                var pwInput = wrap.querySelector('.login fieldset .password input[type=password], .login fieldset .password input');
                if (idInput) idInput.setAttribute('placeholder', 'ID');
                if (pwInput) pwInput.setAttribute('placeholder', 'Password');
            }
            var guestForm = document.querySelector('.guest-order-form');
            if (guestForm) {
                var dds = guestForm.querySelectorAll('.guest-order-fields dd');
                var ph = ['Name', 'Order Number', 'Guest Password'];
                [].slice.call(dds).slice(0, 3).forEach(function (dd, i) {
                    var inputs = dd.querySelectorAll('input');
                    [].slice.call(inputs).forEach(function (el) { el.setAttribute('placeholder', ph[i] || ''); });
                });
            }
        }
        setPlaceholders();
        if (document.readyState === 'complete') {
            setTimeout(setPlaceholders, 50);
        } else {
            window.addEventListener('load', function () { setTimeout(setPlaceholders, 50); });
        }

        /* Order Status 클릭 시 비회원 주문조회 폼 펼치기/접기 */
        function initOrderStatusToggle() {
            var toggleBtn = document.getElementById('order-status-toggle');
            var formWrap = document.getElementById('guest-order-form-toggle');
            var targetContainer = document.querySelector('.order-status-block');

            if (!toggleBtn || !formWrap) return;

            /* 폼을 Order Status 설명 바로 아래에 오도록 .order-status-block 안으로 이동 */
            if (targetContainer && formWrap.parentNode !== targetContainer) {
                targetContainer.appendChild(formWrap);
            }

            toggleBtn.onclick = function (e) {
                e.preventDefault();
                var isClosed = formWrap.classList.contains('is-closed');
                if (isClosed) {
                    formWrap.classList.remove('is-closed');
                    formWrap.setAttribute('aria-hidden', 'false');
                    toggleBtn.setAttribute('aria-expanded', 'true');
                } else {
                    formWrap.classList.add('is-closed');
                    formWrap.setAttribute('aria-hidden', 'true');
                    toggleBtn.setAttribute('aria-expanded', 'false');
                }
            };
        }

        initOrderStatusToggle();
        document.addEventListener('DOMContentLoaded', initOrderStatusToggle);
        window.addEventListener('load', initOrderStatusToggle);
    })();
</script>
