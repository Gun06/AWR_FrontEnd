<!-- 아코디언 스타일: 클릭 시 펼침/접힘 -->
<div class="product-accordion css3-tab" module="mall_faq">
    <details class="accordion-item">
        <summary class="accordion-head">FEATURES <span class="accordion-icon" aria-hidden="true">+</span></summary>
        <div class="accordion-body">
            <div module="product_additional" class="tx_for">
                <pre>{$simple_desc}</pre>
            </div>
        </div>
    </details>
    <details class="accordion-item">
        <summary class="accordion-head">FIT&SIZE <span class="accordion-icon" aria-hidden="true">+</span></summary>
        <div class="accordion-body">
            <div module="product_additional" class="tx_for">{$size_guide_description}</div>
        </div>
    </details>
    <details class="accordion-item">
        <summary class="accordion-head">FABRIC&CARE <span class="accordion-icon" aria-hidden="true">+</span></summary>
        <div class="accordion-body">
            <div module="product_additional" class="tx_for">{$service_info}</div>
        </div>
    </details>
    <details class="accordion-item">
        <summary class="accordion-head">SHIPPING&RETURNS <span class="accordion-icon" aria-hidden="true">+</span></summary>
        <div class="accordion-body">
            <div module="product_additional" class="tx_for">{$shipping_info}</div>
        </div>
    </details>
</div>
