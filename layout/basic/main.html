    <!-- 관심상품(Wishlist): data-use-interest-prd 값으로 사용함/사용안함 판단 후 표시/숨김 -->
    <script>
        (function () {
            var debounceTimer = null;
            function applyWishlistVisibility() {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(function () {
                    var fromBody = (document.body.getAttribute('data-use-interest-prd') || '').trim();
                    var fromEl = (function () {
                        var el = document.getElementById('js-use-interest-prd-value');
                        return (el && el.getAttribute('data-value')) ? (el.getAttribute('data-value') || '').trim() : '';
                    })();
                    var unreplaced = '{$use_interest_prd}';
                    var useFromEl = (fromEl !== '' && fromEl !== unreplaced);
                    var raw = useFromEl ? fromEl : fromBody;
                    var normalized = raw.toUpperCase();
                    var isUnreplaced = (raw === unreplaced);

                    var show;
                    if (isUnreplaced) {
                        // 변수 미치환: 서버 클래스로 판단. 단, 클래스에 '{'가 있으면 |display도 미치환 → 판단 불가, 기본값 숨김
                        var headerLi = document.querySelector('.js-header-wishlist');
                        var hasUnreplacedClass = headerLi && (headerLi.className || '').indexOf('{') !== -1;
                        if (hasUnreplacedClass) {
                            show = false; // 미치환 시 기본값: 사용안함(숨김)
                        } else {
                            show = headerLi ? !headerLi.classList.contains('displaynone') : false;
                        }
                    } else {
                        show = (normalized === 'T' || normalized === 'TRUE' || normalized === 'Y' || normalized === 'YES' || normalized === '1');
                    }

                    var action = show ? 'remove' : 'add';
                    var cls = 'displaynone';
                    document.body.classList[show ? 'add' : 'remove']('wishlist-enabled');
                    var selectors = ['.js-sidebar-wishlist', '.js-basket-interest-prd-link', '.js-header-wishlist', '.js-hamburg-wishlist'];
                    selectors.forEach(function (selector) {
                        document.querySelectorAll(selector).forEach(function (el) { el.classList[action](cls); });
                    });
                    document.querySelectorAll('a[href="/myshop/wish_list.html"]').forEach(function (a) {
                        var li = a.closest('li');
                        if (li && !li.classList.contains('js-sidebar-wishlist') && !li.classList.contains('js-header-wishlist') && !li.classList.contains('js-hamburg-wishlist')) {
                            li.classList[action](cls);
                        }
                    });
                }, 50);
            }
            applyWishlistVisibility();
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyWishlistVisibility);
            window.addEventListener('load', applyWishlistVisibility);
            if (typeof MutationObserver !== 'undefined') {
                var observer = new MutationObserver(function () { applyWishlistVisibility(); });
                observer.observe(document.body, { childList: true, subtree: true });
            }
        })();
    </script>
